name: Update GitHub trends

on:
  workflow_dispatch:

  schedule:
    - cron: "0 9 * * *"
      timezone: "Asia/Seoul"

permissions:
  contents: write

jobs:
  update-trending:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update GitHub trends
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_trending.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- README.md data/trending-history.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/trending-history.json
          git commit -m "docs: update GitHub trends"
          git push
